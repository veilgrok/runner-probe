# Simultaneous 5-job ubuntu probe used only to test whether the
# veilgrok account pool is separate from the veilgrok-ci org pool.
# Dispatch only. Short jobs; no mining.
name: Account 5-job ubuntu probe

on:
  workflow_dispatch:
    inputs:
      hold:
        description: Seconds each job holds (for overlap measurement)
        required: false
        default: "60"
        type: string
      dispatch_time:
        description: UTC ISO-8601 dispatch timestamp from the trigger (for queue time)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        index: [0, 1, 2, 3, 4]
    steps:
      - name: Info and hold
        shell: bash
        env:
          HOLD: ${{ inputs.hold }}
          MATRIX_INDEX: ${{ matrix.index }}
          DISPATCH_TIME: ${{ inputs.dispatch_time }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          PYB=$(command -v python3 || command -v python)
          "$PYB" - <<'PY'
          import json, os, platform, shutil, time
          from datetime import datetime, timezone

          def now():
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")

          start = now()
          d = {
              "event": "start",
              "job_start": start,
              "dispatch_time": os.environ.get("DISPATCH_TIME") or "",
              "matrix_index": os.environ.get("MATRIX_INDEX"),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "os": platform.system(),
              "machine": platform.machine(),
              "cpus": os.cpu_count(),
              "nproc": os.cpu_count(),
              "release": platform.release(),
          }
          try:
              for line in open("/proc/meminfo"):
                  if line.startswith("MemTotal"):
                      mem_kb = int(line.split()[1])
                      d["mem_kib"] = mem_kb
                      d["mem_gib"] = round(mem_kb / 1048576, 2)
                      break
              d["cpu_model"] = next(
                  (l.split(":", 1)[1].strip() for l in open("/proc/cpuinfo")
                   if l.lower().startswith(("model name", "cpu part"))),
                  "",
              )
          except Exception as e:
              d["err"] = str(e)
          t, u, f = shutil.disk_usage("/")
          d["disk_total_gb"] = round(t / 1e9, 1)
          d["disk_free_gb"] = round(f / 1e9, 1)
          print("PROBE_START " + json.dumps(d), flush=True)
          hold = int(os.environ.get("HOLD") or "60")
          time.sleep(max(0, hold))
          d["event"] = "end"
          d["job_end"] = now()
          d["hold_s"] = hold
          print("PROBE_END " + json.dumps(d), flush=True)
          PY
