# Blacksmith runner probe. Dispatch only. Do not trigger this workflow
# until the Blacksmith GitHub App is installed on the veilgrok org/repo.
#
# Free allowance (published): 3,000 x64 2-vCPU minutes per month per org.
# Other sizes draw from that pool (4 vCPU uses 2x, ARM 2-vCPU uses 0.625x).
# Blacksmith currently requires a GitHub organization, not a personal repo
# alone; install the app on a veilgrok org if signup needs one.
name: Blacksmith runner probe

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Number of blacksmith-2vcpu-ubuntu-2404 jobs (1-20)
        required: false
        default: "10"
        type: string
      dispatch_time:
        description: UTC ISO-8601 dispatch timestamp from the trigger (for queue time)
        required: false
        default: ""
        type: string
      include_larger:
        description: Also run one 4vcpu job and one 2vcpu ARM job (they share the free minutes pool)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      dispatch_time: ${{ steps.gen.outputs.dispatch_time }}
      n: ${{ steps.gen.outputs.n }}
      include_larger: ${{ steps.gen.outputs.include_larger }}
    steps:
      - name: Build matrix
        id: gen
        env:
          JOBS: ${{ inputs.jobs }}
          DISPATCH_TIME: ${{ inputs.dispatch_time }}
          INCLUDE_LARGER: ${{ inputs.include_larger }}
        run: |
          python3 << 'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          raw = (os.environ.get("JOBS") or "10").strip()
          try:
              n = int(raw)
          except ValueError:
              raise SystemExit(f"jobs must be an integer, got {raw!r}")
          n = max(1, min(20, n))
          dt = (os.environ.get("DISPATCH_TIME") or "").strip()
          if not dt:
              dt = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.%fZ")
          include = (os.environ.get("INCLUDE_LARGER") or "true").strip().lower() in {"1", "true", "yes"}
          matrix = {"include": [{"index": i} for i in range(n)]}
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"n={n}\n")
              f.write(f"dispatch_time={dt}\n")
              f.write(f"include_larger={'true' if include else 'false'}\n")
              f.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
          print("jobs", n, "include_larger", include)
          PY

  probe-2vcpu:
    needs: setup
    # Requires the Blacksmith app. Do not dispatch until it is installed.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe this runner
        env:
          MATRIX_INDEX: ${{ matrix.index }}
          RUNNER_NAME: ${{ runner.name }}
          DISPATCH_TIME: ${{ needs.setup.outputs.dispatch_time }}
          PROBE_POOL: blacksmith
          RESOURCE_CLASS: blacksmith-2vcpu-ubuntu-2404
        run: python3 .github/scripts/probe_job.py

      - name: Upload probe JSON
        uses: actions/upload-artifact@v4
        with:
          name: probe-2vcpu-${{ matrix.index }}
          path: probe.json
          if-no-files-found: error

  probe-4vcpu:
    needs: setup
    if: needs.setup.outputs.include_larger == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe this runner
        env:
          MATRIX_INDEX: "0"
          RUNNER_NAME: ${{ runner.name }}
          DISPATCH_TIME: ${{ needs.setup.outputs.dispatch_time }}
          PROBE_POOL: blacksmith
          RESOURCE_CLASS: blacksmith-4vcpu-ubuntu-2404
        run: python3 .github/scripts/probe_job.py
      - name: Upload probe JSON
        uses: actions/upload-artifact@v4
        with:
          name: probe-4vcpu-0
          path: probe.json
          if-no-files-found: error

  probe-2vcpu-arm:
    needs: setup
    if: needs.setup.outputs.include_larger == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Probe this runner
        env:
          MATRIX_INDEX: "0"
          RUNNER_NAME: ${{ runner.name }}
          DISPATCH_TIME: ${{ needs.setup.outputs.dispatch_time }}
          PROBE_POOL: blacksmith
          RESOURCE_CLASS: blacksmith-2vcpu-ubuntu-2404-arm
        run: python3 .github/scripts/probe_job.py
      - name: Upload probe JSON
        uses: actions/upload-artifact@v4
        with:
          name: probe-2vcpu-arm-0
          path: probe.json
          if-no-files-found: error

  aggregate:
    needs: [setup, probe-2vcpu, probe-4vcpu, probe-2vcpu-arm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download probe artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: probe-*
          merge-multiple: false

      - name: Aggregate
        run: python3 .github/scripts/aggregate.py

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.json
          if-no-files-found: error
